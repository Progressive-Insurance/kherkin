plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish'
}

def getVersionName = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', 'HEAD'
            standardOutput = stdout
        }
        def describe = stdout.toString().trim()
        if (describe.contains("-")) {
            describe += "-SNAPSHOT"
        }
        return describe
    } catch (Exception ignored) {
        throw new GradleException("Failed to get version name.")
    }
}

android {
    compileSdk 37
    version getVersionName()

    defaultConfig {
        minSdk 24
        targetSdk 37
        versionName getVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

afterEvaluate {
    mavenPublishing {
        publishToMavenCentral(true)
        signAllPublications()

        def groupId = "com.progressive.kherkin"
        def artifactId = ARTIFACT_ID
        def versionName = getVersionName()

        logger.lifecycle("Publishing artifact: ${groupId}:${artifactId}:${versionName}")

        coordinates("com.progressive.kherkin", ARTIFACT_ID, getVersionName())

        pom {
            name = ARTIFACT_ID
            description = DESCRIPTION
            inceptionYear = "2024"
            url = "https://github.com/Progressive-Insurance/kherkin"
            licenses {
                license {
                    name = "MIT License"
                    url = "http://www.opensource.org/licenses/mit-license.php"
                }
            }
            developers {
                developer {
                    id = "smugleafdev"
                    name = "Matthew Rockwell"
                    url = "https://github.com/smugleafdev"
                }
            }
            scm {
                url = "http://github.com/Progressive-Insurance/kherkin"
                connection = "scm:git:https://github.com/Progressive-Insurance/kherkin.git"
                developerConnection = "scm:git:ssh://github.com/Progressive-Insurance/kherkin.git"
            }
        }
    }
}